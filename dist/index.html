<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>太阳系 3D 可视化</title>
  
  <script type="module" crossorigin src="/assets/index-ff64763d.js"></script>
  <link rel="stylesheet" href="/assets/index-378f324f.css">
</head>
<body>
  <div id="app">
    <canvas id="canvas"></canvas>
    
    <header class="header">
      <h1 class="title">🌌 太阳系 3D 可视化</h1>
      <p class="hint">拖拽旋转 · 滚轮缩放 · 点击行星查看详情</p>
    </header>

    <aside class="control-panel">
      <div class="panel-header">
        <h2>⚙️ 控制面板</h2>
      </div>

      <div class="control-group">
        <h3>⏱️ 公转速度</h3>
        <div class="slider-container">
          <span class="slider-label">0.1x</span>
          <input type="range" id="speed-slider" min="0.1" max="10" step="0.1" value="1" class="custom-slider">
          <span class="slider-label">10x</span>
        </div>
        <div class="slider-value" id="speed-value">1.0x</div>
      </div>

      <div class="control-group">
        <h3>📐 行星大小比例</h3>
        <div class="slider-container">
          <span class="slider-label">0.5x</span>
          <input type="range" id="scale-slider" min="0.5" max="5" step="0.1" value="1" class="custom-slider">
          <span class="slider-label">5x</span>
        </div>
        <div class="slider-value" id="scale-value">1.0x</div>
      </div>

      <div class="control-group">
        <h3>🔗 轨道线</h3>
        <label class="toggle-switch">
          <input type="checkbox" id="orbit-toggle" checked>
          <span class="toggle-slider"></span>
        </label>
      </div>

      <div class="control-group">
        <h3>🪐 行星显示</h3>
        <div id="planet-toggles"></div>
      </div>
    </aside>

    <div id="info-panel" class="info-panel hidden">
      <button class="close-btn" id="close-panel">×</button>
      <div class="panel-content">
        <h2 id="planet-name"></h2>
        <div class="stats-grid">
          <div class="stat-item">
            <span class="stat-icon">📏</span>
            <div class="stat-content">
              <span class="stat-label">直径</span>
              <span class="stat-value" id="planet-diameter"></span>
            </div>
          </div>
          <div class="stat-item">
            <span class="stat-icon">📍</span>
            <div class="stat-content">
              <span class="stat-label">距太阳</span>
              <span class="stat-value" id="planet-distance"></span>
            </div>
          </div>
          <div class="stat-item">
            <span class="stat-icon">🔄</span>
            <div class="stat-content">
              <span class="stat-label">公转周期</span>
              <span class="stat-value" id="planet-period"></span>
            </div>
          </div>
        </div>
        <p class="description" id="planet-description"></p>
      </div>
    </div>
  </div>

  
</body>
</html>
